server:
  port: 8001

spring:
  main:
    web-application-type: servlet

  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: content-service
              uri: lb://CONTENT
              predicates:
                - Path=/content/**

            - id: auth-service
              uri: lb://AUTH
              predicates:
                - Path=/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/