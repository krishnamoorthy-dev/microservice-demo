server:
  port: 8001

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: content-service
              uri: lb://CONTENT
              predicates:
                - Path=/content/**
              filters:
                - StripPrefix=0
                - name: JWTAuthFilter

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway.server.webflux: TRACE
    org.springframework.cloud.gateway: TRACE